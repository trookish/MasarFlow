name: CI

on:
  push:
    branches: [main, "release/**", "overhaul/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # The whole suite is Windows-only by design (D12): the packaged app, the
    # guard checks and the smoke harness all target win32.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0 # must match package.json "packageManager"

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (workspace)
        run: pnpm typecheck

      - name: Typecheck (desktop main/preload)
        run: pnpm desktop:typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (Next)
        run: pnpm build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-logs
          path: |
            desktop/dist/*.yml
            .next/*.log
          if-no-files-found: ignore
          retention-days: 7

  # The authoritative gate (AGENTS.md): guard black-box check, then the packaged app
  # and its Playwright suite. Required on every PR.
  desktop-e2e:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app server
        run: pnpm build:app

      - name: Security check (guard denial matrix, dev mode, SSRF)
        run: pnpm security:check

      - name: Package (unpacked)
        run: pnpm desktop:dist:dir

      - name: Packaged smoke
        run: pnpm smoke:desktop

      - name: Packaged e2e
        run: pnpm e2e:desktop

      - name: Upload evidence and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-evidence
          path: |
            reports/v0.3/**
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Browser-mode e2e (the dev-convenience suite; the authoritative packaged
  # gate is `desktop-e2e` above). If this job proves flaky, delete it.
  e2e-browser:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Next)
        run: pnpm build

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install chromium

      - name: Browser e2e (one retry absorbs CI flake)
        run: pnpm exec playwright test --config tests/playwright.config.ts --retries=1

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
