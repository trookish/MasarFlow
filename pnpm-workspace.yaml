# Next standalone on Windows cannot run with pnpm's isolated symlink layout
# (EPERM on file-type dir symlinks). Measured in spike S1: .hermes/spikes/S1.md.
nodeLinker: hoisted

packages:
  - "."
  - "desktop"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  onnxruntime-node: false
  protobufjs: false
  unrs-resolver: true
