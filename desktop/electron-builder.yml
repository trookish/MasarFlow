appId: com.masarflow.app
productName: MasarFlow
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - resources/**
extraResources:
  # Spike S1: electron-builder hard-drops any entry named exactly `node_modules`
  # from extraResources (app-builder-lib/out/util/filter.js returns false for
  # `relative === "node_modules"`). The server therefore ships as TWO entries;
  # paths inside the second one are `next/...`, `react/...`, never the bare
  # string, so they survive the filter.
  - from: app-server
    to: app-server
  - from: app-server/node_modules
    to: app-server/node_modules
  # P10.T9: the Control Center's "What changed" block reads this file.
  - from: ../CHANGELOG.md
    to: CHANGELOG.md
# node-pty ships N-API prebuilds (ABI-stable) — no native rebuild needed
npmRebuild: false
asarUnpack:
  - "**/node_modules/node-pty/**"
# Auto-update feed (F9). The workflow never lets electron-builder publish
# (that would create tag v0.2.0 instead of v0.2.0.0 — see P10.T14); this block
# only makes electron-builder emit latest.yml next to the installers.
publish:
  provider: github
  owner: trookish
  repo: MasarFlow
  channel: latest
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
# D12/Q4: Windows x64 is first-class for 0.2.0.0. These blocks exist so a future
# `--mac`/`--linux` run is a config change, not an archaeology project. They are
# NEVER built in CI for this release and are not validated — do not advertise them.
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
